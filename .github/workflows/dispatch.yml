name: Console Task Dispatch

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Existing issue number to dispatch"
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: console-dispatch-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: false

env:
  ENGINE_REPO: krisharyanagarwal-dev/openalice-fleet
  CONSOLE_REPO: krisharyanagarwal-dev/agent-fleet-console
  MAX_BODY_CHARS: 8000

jobs:
  gate:
    name: Gate + route
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      agent: ${{ steps.parse.outputs.agent }}
      should_dispatch: ${{ steps.gate.outputs.should_dispatch }}
      issue_number: ${{ steps.parse.outputs.issue_number }}
    steps:
      - name: Get issue details
        id: get_issue
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.issue_number }}" ]; then
            # workflow_dispatch: fetch issue via API
            ISSUE_NUM="${{ github.event.inputs.issue_number }}"
            RESP=$(gh api "repos/${{ github.repository }}/issues/${ISSUE_NUM}" 2>/dev/null || echo '{}')
            TITLE=$(echo "$RESP" | jq -r '.title // ""')
            BODY=$(echo "$RESP" | jq -r '.body // ""')
            AUTHOR=$(echo "$RESP" | jq -r '.author_association // "NONE"')
            CREATED_AT=$(echo "$RESP" | jq -r '.created_at // ""')
            HTML_URL=$(echo "$RESP" | jq -r '.html_url // ""')
          else
            # issues: opened event
            TITLE="${{ github.event.issue.title }}"
            BODY="${{ github.event.issue.body }}"
            AUTHOR="${{ github.event.issue.author_association }}"
            ISSUE_NUM="${{ github.event.issue.number }}"
            CREATED_AT="${{ github.event.issue.created_at }}"
            HTML_URL="${{ github.event.issue.html_url }}"
          fi

          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"
          echo "issue_number=$ISSUE_NUM" >> "$GITHUB_OUTPUT"
          echo "created_at=$CREATED_AT" >> "$GITHUB_OUTPUT"
          echo "html_url=$HTML_URL" >> "$GITHUB_OUTPUT"

      - name: Parse agent slug
        id: parse
        shell: bash
        run: |
          TITLE="${{ steps.get_issue.outputs.title }}"
          BODY="${{ steps.get_issue.outputs.body }}"
          BODY_LEN=${#BODY}

          if [[ ! "$TITLE" =~ ^agent/([a-z0-9-]{2,64}):\ .+ ]]; then
            echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
            echo "agent=" >> "$GITHUB_OUTPUT"
            echo "issue_number=${{ steps.get_issue.outputs.issue_number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AGENT="${BASH_REMATCH[1]}"

          if [ "$BODY_LEN" -gt "${MAX_BODY_CHARS}" ]; then
            echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
            echo "agent=$AGENT" >> "$GITHUB_OUTPUT"
            echo "issue_number=${{ steps.get_issue.outputs.issue_number }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "agent=$AGENT" >> "$GITHUB_OUTPUT"
          echo "should_dispatch=true" >> "$GITHUB_OUTPUT"
          echo "issue_number=${{ steps.get_issue.outputs.issue_number }}" >> "$GITHUB_OUTPUT"

      - name: Author gate
        id: gate
        shell: bash
        run: |
          AUTHOR="${{ steps.get_issue.outputs.author }}"
          if [[ "$AUTHOR" == "OWNER" || "$AUTHOR" == "COLLABORATOR" || "$AUTHOR" == "MEMBER" ]]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Close non-gated issues
        if: steps.gate.outputs.ok != '1'
        uses: peter-evans/create-or-update-comment@v4
        with:
          repository: ${{ github.repository }}
          comment-id: ${{ steps.parse.outputs.issue_number }}
          body: |
            ⛔ **Console task gated.**

            Only repo members can dispatch agent tasks. Your issue has been closed.

            To use the fleet, join the `krisharyanagarwal-dev/agent-fleet-console` repo as a collaborator, or run agents locally via `opencode run --agent <slug> "..."`.

          edit-mode: replace
      - name: Close non-gated issues (issue state)
        if: steps.gate.outputs.ok != '1'
        run: gh issue close ${{ steps.parse.outputs.issue_number }}
        env:
          GH_TOKEN: ${{ github.token }}

  dispatch:
    name: Send to engine
    needs: gate
    if: needs.gate.outputs.should_dispatch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch to engine
        env:
          GH_TOKEN: ${{ secrets.CONSOLE_DISPATCH_TOKEN }}
          ENGINE_REPO: ${{ env.ENGINE_REPO }}
          ISSUE_NUMBER: ${{ needs.gate.outputs.issue_number }}
          AGENT: ${{ needs.gate.outputs.agent }}
          TITLE: ${{ steps.get_issue.outputs.title }}
          BODY: ${{ steps.get_issue.outputs.body }}
          CREATED_AT: ${{ steps.get_issue.outputs.created_at }}
          HTML_URL: ${{ steps.get_issue.outputs.html_url }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CONSOLE_DISPATCH_TOKEN not set"
            exit 1
          fi

          PAYLOAD=$(jq -n \
            --arg event_type "console-task" \
            --argjson issue_number "$ISSUE_NUMBER" \
            --arg agent "$AGENT" \
            --arg title "$TITLE" \
            --arg prompt "$BODY" \
            --arg created_at "$CREATED_AT" \
            --arg html_url "$HTML_URL" \
            '{
              event_type: $event_type,
              client_payload: {
                issue_number: $issue_number,
                agent: $agent,
                title: $title,
                prompt: $prompt,
                created_at: $created_at,
                html_url: $html_url
              }
            }')

          HTTP_CODE=$(curl -s -o /tmp/dispatch.body -w "%{http_code}" -X POST "https://api.github.com/repos/$ENGINE_REPO/dispatches" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "::notice::Dispatched task #$ISSUE_NUMBER (agent: $AGENT) to $ENGINE_REPO"
          else
            echo "::error::Dispatch failed HTTP $HTTP_CODE"
            cat /tmp/dispatch.body
            exit 1
          fi
