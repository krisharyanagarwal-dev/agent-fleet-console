name: Console CI

on:
  push:
    branches: [main, gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Validate console files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify required files exist
        run: |
          test -f docs/index.html
          test -f docs/app.js
          test -f docs/style.css
          test -f .github/workflows/dispatch.yml
          echo "console structure OK"
